spring.application.name=hotel-api
server.port=8080

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/hotel_management_system?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# If your MySQL root has password, change spring.datasource.password above.
